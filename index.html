<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mosaic Maker Workbench</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app-container">
    <nav id="sidebar">
        <div class="sidebar-item active">Mosaic Maker</div>
        <!-- <div class="sidebar-item">GCode Extractor</div>
        <div class="sidebar-item">PLC Monitor</div> -->
    </nav>

    <main id="workspace">
        <div class="tabs">
            <button class="tab-btn active" data-target="tab-source">1. Source</button>
            <button class="tab-btn" data-target="tab-grid">2. Grid Config</button>
            <button class="tab-btn" data-target="tab-border">3. Borders</button>
        </div>

        <div class="tab-content active" id="tab-source">
            <fieldset>
                <legend>Master Image</legend>
                <input type="file" id="input-image" accept="image/png, image/jpeg">
                <div class="status-box" id="img-status">No image loaded.</div>
            </fieldset>
            <fieldset>
                <legend>Tile Palette (Optional)</legend>
                <input type="file" id="input-palette" accept="image/png, image/jpeg" multiple>
                <div class="status-box">Load 10x10 base colors.</div>
            </fieldset>
        </div>

        <div class="tab-content" id="tab-grid">
            <fieldset>
                <legend>Resolution</legend>
                <label>Cell Count X:</label>
                <input type="number" id="cell-count-x" placeholder="e.g., 60">
                
                <label>Cell Count Y (Auto-calculated):</label>
                <input type="number" id="cell-count-y" disabled>
                
                <label>Cell Width (px):</label>
                <input type="number" id="cell-width" value="25">
            </fieldset>
        </div>

        <div class="tab-content" id="tab-border">
            <fieldset>
                <legend>Grid Lines</legend>
                <label><input type="checkbox" id="enable-border"> Enable Borders</label>
                
                <label>Thickness (px):</label>
                <input type="number" id="border-thickness" value="1" min="1">
                
                <label>Color:</label>
                <input type="color" id="border-color" value="#000000">
            </fieldset>
        </div>

        <div id="output-container">
            <canvas id="render-canvas"></canvas>
        </div>

        <div id="action-bar">
            <button id="btn-generate">Generate & Save PNG</button>
            <span id="warning-msg"></span>
        </div>
    </main>
</div>

<script src="app.js"></script>
</body>
</html>
